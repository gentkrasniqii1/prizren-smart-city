name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build shared types
        run: npm run build -w @prizren/shared-types

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://prizren:prizren@localhost:5432/prizren_smart_city?schema=public

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build API
        run: npm run build -w @prizren/api

      - name: Build web
        run: npm run build -w @prizren/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
