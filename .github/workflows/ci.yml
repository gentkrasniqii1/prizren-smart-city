name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DUMMY_DATABASE_URL: postgresql://prizren:prizren@localhost:5432/prizren_smart_city?schema=public

jobs:
  backend:
    name: Backend (lint+test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build -w @prizren/shared-types

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DUMMY_DATABASE_URL }}
          DIRECT_URL: ${{ env.DUMMY_DATABASE_URL }}

      - name: Lint API
        run: npm run lint -w @prizren/api

      - name: Test API
        run: npm test -w @prizren/api

  frontend:
    name: Frontend (lint+test+build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build -w @prizren/shared-types

      - name: Lint web
        run: npm run lint -w @prizren/web

      - name: Build web
        run: npm run build -w @prizren/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
