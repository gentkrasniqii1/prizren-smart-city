services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: prizren-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prizren_smart_city}
      POSTGRES_USER: ${POSTGRES_USER:-prizren}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prizren}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prizren -d prizren_smart_city']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prizren-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    profiles:
      - redis

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: prizren-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NODE_ENV: production
      # Use Compose service hostname "postgres" (NOT localhost / host.docker.internal).
      DATABASE_URL: postgresql://${POSTGRES_USER:-prizren}:${POSTGRES_PASSWORD:-prizren}@postgres:5432/${POSTGRES_DB:-prizren_smart_city}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      SENTRY_DSN: ${SENTRY_DSN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/auth/google/callback}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    profiles:
      - full

volumes:
  postgres_data:
